name: Diagnose Gleisverlauf

on:
  push:
    branches: [diagnose]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: München Hbf -> Nürnberg Hbf
        run: python3 -u tools/diagnose.py "München Hbf" "Nürnberg Hbf"
      - name: Daten in den Diagnose-Branch legen
        run: |
          mkdir -p tools/data && cp out/*.json tools/data/
          git config user.name "diagnose-bot"
          git config user.email "diagnose-bot@users.noreply.github.com"
          git add tools/data
          git commit -m "Diagnose-Daten [skip ci]" || true
          git push
