name: Diagnose Gleisverlauf

on:
  push:
    branches: [diagnose]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Transitous München Hbf -> Nürnberg Hbf
        run: python3 -u tools/transitous.py
      - name: Antwort in den Diagnose-Branch legen
        run: |
          git config user.name "diagnose-bot"
          git config user.email "diagnose-bot@users.noreply.github.com"
          git add tools/data/motis_plan.json
          git commit -m "Diagnose-Daten Transitous [skip ci]" || true
          git push
